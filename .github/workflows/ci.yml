# GitHub Actions CI — Atom test suite
#
# Runs on Windows (Win32-specific code: OCR, COM, Win32 API).
# Installs system dependencies (Tesseract-OCR), Python packages,
# Playwright browsers, then executes the full pytest suite plus
# the integration smoke test.
#
# Triggers: push to main/master, pull requests.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Headless Qt — all GUI tests set this via offscreen platform
  QT_QPA_PLATFORM: "offscreen"
  # Python assertions enabled during testing
  PYTHONASSERT: "1"

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ────────────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      # ── Python setup ────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # ── Install Python dependencies ─────────────────────────────
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      # ── Install Tesseract-OCR (required by OCR tests) ───────────
      # This used to download a pinned UB-Mannheim release asset. Once that
      # release was replaced the URL returned 404 and the job failed before a
      # single test ran. Chocolatey tracks the current build and needs no URL;
      # the OCR tests also skip themselves when the binary is missing, so this
      # step can never block the suite again.
      - name: Install Tesseract-OCR
        shell: pwsh
        continue-on-error: true
        run: |
          choco install tesseract --no-progress -y
          $installPath = "C:\Program Files\Tesseract-OCR"
          if (Test-Path "$installPath	esseract.exe") {
            echo "$installPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            & "$installPath	esseract.exe" --version
          } else {
            Write-Host "Tesseract not found after install - OCR integration tests will skip"
          }

      # ── Install Playwright browsers (required by browser tests) ─
      - name: Install Playwright browsers
        continue-on-error: true
        run: |
          python -m playwright install chromium 2>&1

      # ── Compilation check ───────────────────────────────────────
      - name: Compile check
        run: |
          python -m compileall atom.py atom_cli.py core/ ui/ tests/ -q

      # ── Run test suite ─────────────────────────────────────────
      # Job-level 30-minute timeout prevents hangs; no --timeout flag
      # needed since some worker lifecycle tests have longer waits.
      - name: Run full test suite
        run: |
          python -m pytest tests/ -v --tb=short 2>&1
        env:
          QT_QPA_PLATFORM: "offscreen"
          PYOPENGL_PLATFORM: ""

      # ── Run integration smoke test separately (for clear signal) ─
      # Uses success()||failure() so it runs even if the full suite
      # fails, but skips if setup steps (pip install, Tesseract, etc.)
      # failed.
      - name: Run integration smoke test
        if: success() || failure()
        run: |
          python -m pytest tests/test_integration_smoke.py -v --tb=short 2>&1
        env:
          QT_QPA_PLATFORM: "offscreen"

      # ── Summary ─────────────────────────────────────────────────
      - name: Test summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  Atom CI — Test Suite Results"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Platform: Windows ($env:RUNNER_OS)"
          Write-Host "Python:   $((python --version 2>&1))"
          Write-Host ""
          if ("${{ job.status }}" -eq "success") {
            Write-Host "  [PASSED] All checks passed!" -ForegroundColor Green
          } else {
            Write-Host "  [FAILED] Some checks failed!" -ForegroundColor Red
          }
